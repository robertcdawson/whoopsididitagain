name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  ios:
    # FoundationModels ships with the iOS 26 SDK. macos-15 still defaults to
    # Xcode 16.4, even though newer Xcodes are installed alongside it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swift-format lint --recursive ios/WhoopsApp
      - name: Build app and test bundles
        run: >-
          xcodebuild
          -project ios/WhoopsApp/WhoopsApp.xcodeproj
          -scheme WhoopsApp
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          -derivedDataPath /tmp/whoops-derived-data
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Run unit tests
        run: >-
          xcodebuild
          -project ios/WhoopsApp/WhoopsApp.xcodeproj
          -scheme WhoopsApp
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          -derivedDataPath /tmp/whoops-derived-data
          CODE_SIGNING_ALLOWED=NO
          test-without-building
          -only-testing:WhoopsAppTests
