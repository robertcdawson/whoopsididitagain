name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swift-format lint --recursive ios/WhoopsApp
      - name: Build app and test bundles
        run: >-
          xcodebuild
          -project ios/WhoopsApp/WhoopsApp.xcodeproj
          -scheme WhoopsApp
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/whoops-derived-data
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
